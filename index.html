<details class="topic" id="important-steps-after-arriving-in-magdeburg-4" data-title="important steps after arriving in magdeburg">
    <summary><span class="topic-number">04</span><span class="topic-title">Important Steps After Arriving in Magdeburg</span><span class="topic-icon" aria-hidden="true">+</span></summary>
    <div class="topic-content"><h2>1. City Registration</h2>
<p>You must book an appointment with the <strong>Bürgerbüro (City Registration Office)</strong> to register your address in Magdeburg.</p>
<p><a href="https://terminvergabe.magdeburg.de/select2?md=2">https://terminvergabe.magdeburg.de/select2?md=2</a></p>
<hr>
<h2>2. Inform the Enrolment Office</h2>
<p>You must notify the <strong>Enrolment Office</strong> about:</p>
<ul>
<li>Your residential address  </li>
<li>The registration certificate from Bürgerbüro  </li>
<li>Your visa extension</li>
</ul>
<p><a href="https://www.ovgu.de/unimagdeburg/en/International/Incoming+_+Ways+to+the+University/International+Students/Organizing+Your+Stay/Enrolment-p-48644.html">https://www.ovgu.de/unimagdeburg/en/International/Incoming+_+Ways+to+the+University/International+Students/Organizing+Your+Stay/Enrolment-p-48644.html</a></p>
<hr>
<h2>3. Student ID Card</h2>
<p>After submitting your address, your <strong>student ID card will be sent by post</strong>.</p>
<p>More information:</p>
<p><a href="https://www.ovgu.de/en/Study/First_Year+Orientation/First+Steps/Student+ID+card.html">https://www.ovgu.de/en/Study/First_Year+Orientation/First+Steps/Student+ID+card.html</a></p>
<p>The student card must be validated at machines located in:</p>
<ul>
<li>Campus Service Center  </li>
<li>Building 6  </li>
<li>Building 10  </li>
<li>Building 40  </li>
<li>University Library</li>
</ul>
<p>You must also create a <strong>computer centre account</strong> if you do not already have one.</p>
<h2>4. Visa Extension</h2>
<p>You must register at the <strong>Foreigner’s Registration Office</strong> to extend your visa.</p>
<p><a href="https://www.ovgu.de/unimagdeburg/en/International/Incoming+_+Ways+to+the+University/International+Students/Organizing+Your+Stay/Foreigners_+Office-p-54296.html">https://www.ovgu.de/unimagdeburg/en/International/Incoming+_+Ways+to+the+University/International+Students/Organizing+Your+Stay/Foreigners_+Office-p-54296.html</a></p>
<hr>
</div>
  </details>
<details class="topic" id="understanding-the-myovgu-portal-5" data-title="understanding the myovgu portal">
    <summary><span class="topic-number">05</span><span class="topic-title">Understanding the myOVGU Portal</span><span class="topic-icon" aria-hidden="true">+</span></summary>
    <div class="topic-content"><p>Please use the <strong>myOVGU portal</strong> regularly to check your enrolment status and study information.</p>
<p><img src="https://github.com/Masub27/Intro/blob/main/Screenshot%2034.png?raw=true" alt=""></p>
<p>Portal link:</p>
<p><a href="https://myovgu.ovgu.de/qisserver/pages/cs/sys/portal/hisinoneStartPage.faces">https://myovgu.ovgu.de/qisserver/pages/cs/sys/portal/hisinoneStartPage.faces</a></p>
<p>Important notes:</p>
<ul>
<li>Personal access to the myOVGU portal must be set up immediately.  </li>
<li>Students who applied through an agency should obtain login details from the agency.  </li>
<li>After receiving access, change your password immediately.</li>
</ul>
<p>Example of locking:</p>
<p><img src="https://github.com/Masub27/Intro/blob/main/42.jpg?raw=true" alt=""></p>
<p>Example problem:</p>
<p>Insurance status report (<strong>M10</strong>) missing.<br>Send it to: <strong><a href="mailto:enrolment@ovgu.de">enrolment@ovgu.de</a></strong></p>
<p><img src="https://github.com/Masub27/Intro/blob/main/43.jpg?raw=true" alt=""></p>
<p>Common reasons for blocking:</p>
<ul>
<li>Missing insurance confirmation  </li>
<li>Missing residential address  </li>
<li>Unpaid tuition fees</li>
</ul>
<hr>
</div>
  </details>
<details class="topic" id="deutschland-semester-ticket-6" data-title="deutschland semester ticket">
    <summary><span class="topic-number">06</span><span class="topic-title">Deutschland Semester Ticket</span><span class="topic-icon" aria-hidden="true">+</span></summary>
    <div class="topic-content"><p>The <strong>Deutschlandsemesterticket</strong> is valid across Germany on public transport except:</p>
<ul>
<li>ICE  </li>
<li>IC / EC trains</li>
</ul>
<p>More information:</p>
<p><a href="https://www.ovgu.de/deutschlandsemesterticket.html">https://www.ovgu.de/deutschlandsemesterticket.html</a></p>
<hr>
</div>
  </details>
<details class="topic" id="creating-and-using-the-university-account-7" data-title="creating and using the university account">
    <summary><span class="topic-number">07</span><span class="topic-title">Creating and Using the University Account</span><span class="topic-icon" aria-hidden="true">+</span></summary>
    <div class="topic-content"><p>Activate your university account here:</p>
<p><a href="https://wext.ovgu.de/selfservice/terminal/user_anm.php">https://wext.ovgu.de/selfservice/terminal/user_anm.php</a></p>
<p><img src="https://github.com/Masub27/Intro/blob/main/Screenshot%2035.png?raw=true" alt=""></p>
<p>This account is used for:</p>
<ul>
<li>Campus internet  </li>
<li>OVGU webmail  </li>
<li>MyOVGU portal  </li>
<li>Library services</li>
</ul>
<p>OVGU Webmail:</p>
<p><a href="https://webmail.ovgu.de/stable/">https://webmail.ovgu.de/stable/</a></p>
<p>All official communication from the university will be sent to this email address.</p>
<hr>
</div>
  </details>
<details class="topic" id="registration-for-courses-on-elearning-8" data-title="registration for courses on elearning">
    <summary><span class="topic-number">08</span><span class="topic-title">Registration for courses on eLearning</span><span class="topic-icon" aria-hidden="true">+</span></summary>
    <div class="topic-content"><p>The registration for courses on eLearning is mandatory for all students to sign up for courses. 
You must create university account (as mentioned in step 2) prior to registration on eLearning portal. Please use the following link for course registration:</p>
<p><a href="https://elearning.ovgu.de/">https://elearning.ovgu.de/</a></p>
</div>
  </details>

<details class="topic" id="important-information-10" data-title="important information">
    <summary><span class="topic-number">10</span><span class="topic-title">Important Information</span><span class="topic-icon" aria-hidden="true">+</span></summary>
    <div class="topic-content"><p>The <strong>certificate of enrolment is not sent by post or email</strong>.</p>
<p>You must download it yourself from:</p>
<p><strong>myOVGU → Reports section</strong></p>
<p>Under the <strong>Students</strong> tab you can:</p>
<ul>
<li>Download study certificates  </li>
<li>Check your study status  </li>
<li>Update your personal information</li>
</ul>
<hr>
</div>
  </details>

    <div class="topic-content"><p>Please regularly check:</p>
<ul>
<li>Your <strong>myOVGU portal</strong>  </li>
<li>Your <strong>OVGU email account</strong>  </li>
<li>All <strong>important deadlines</strong></li>
</ul>
<p>Following these steps will help ensure a smooth start to your studies in the ITVET programme.</p>
</div>
  </details>

<details class="topic" id="step-1-26" data-title="step 1">
    <summary><span class="topic-number">26</span><span class="topic-title">Step 1</span><span class="topic-icon" aria-hidden="true">+</span></summary>
    <div class="topic-content"><h2>Preparatory work</h2>
<pre><code>* Start thinking about your topic early on.
</code></pre>
<ul>
<li>Don&#39;t wait until the last semester to start your Master&#39;thesis!</li>
</ul>
</div>
  </details>
<details class="topic" id="step-2-27" data-title="step 2">
    <summary><span class="topic-number">27</span><span class="topic-title">Step 2</span><span class="topic-icon" aria-hidden="true">+</span></summary>
    <div class="topic-content"><h2>Participation in the ITVET Master Colloquium</h2>
<p>  The main aim of the ITVET Master&#39;s colloquium is to support students in the preparation of their Master&#39;s theses, particularly in the areas of academic writing and empirical research.</p>
<h2>Content</h2>
<ul>
<li><p>Presentations of scientific exposés (students)</p>
</li>
<li><p>Discussions</p>
</li>
</ul>
<h2>Requirements</h2>
<ul>
<li>Writing a scientific exposé of your Master&#39;s thesis </li>
<li><pre><code>  Presentation of scientific exposé 
</code></pre>
</li>
<li><pre><code>  Active participation (Switch on the cameras)
</code></pre>
</li>
</ul>
</div>
  </details>
<details class="topic" id="step-3-28" data-title="step 3">
    <summary><span class="topic-number">28</span><span class="topic-title">Step 3</span><span class="topic-icon" aria-hidden="true">+</span></summary>
    <div class="topic-content"><h2>Registration of Master’s thesis</h2>
<p>   <strong>Requirements for registering the Master&#39;s thesis:</strong></p>
<ul>
<li><p>You have found a supervisor to review your Master&#39;s thesis<br>   (our academic staff will only approve a review if you have written a good scientific exposé)</p>
</li>
<li><p>Your tuition fees have all been duly paid</p>
</li>
<li><p>You have earned at least 75 CP</p>
</li>
</ul>
<p><strong>Registration Process:</strong></p>
<ul>
<li><p>Develop a scientific exposé </p>
</li>
<li><p>Find a secondary supervisor who will review your work (Prof. 
Dr. Bünning is always the primary reviewer)Potential supervisors are: Dr. Yuliya Nepomyashcha(qualitative research), Lina Lockau(qualitative research), Hannes Tegelbeckers(quantitative research)</p>
<ul>
<li>Fill out and sign the registration form</li>
</ul>
</li>
<li><p>Send the completed and signed registration form to your supervisor (he will sign it and also take care of Prof. Bünning&#39;s signature)</p>
</li>
<li><p>Submit the registration form to the Examination Office: Ina Pietrulla Faculty of Humanities Examination Office <a href="https://hw.ovgu.de/hw/en/Study+and+Teaching/Examination+Office/Administrative+Staff/Ina+Pietrulla.html">https://hw.ovgu.de/hw/en/Study+and+Teaching/Examination+Office/Administrative+Staff/Ina+Pietrulla.html</a> (if you are not in Magdeburg, there is also the possibility that your supervisor submits the form to the Examination Office, but for this he needs a power of attorney)</p>
</li>
<li><p>After you have submitted the registration form to the Examination Office, you will receive a confirmation (e.g. as proof for immigration authorities)</p>
</li>
</ul>
</div>
  </details>
<details class="topic" id="step-4-29" data-title="step 4">
    <summary><span class="topic-number">29</span><span class="topic-title">Step 4</span><span class="topic-icon" aria-hidden="true">+</span></summary>
    <div class="topic-content"><h2>Submission of Master’s thesis</h2>
<pre><code>	* Processing time: 6 months (date of submission is stated on registration confirmation document)
</code></pre>
<ul>
<li><p>You must submit two printed versions of your Master&#39;s thesis to the Examination Office, as well as a PDF file (the date in the PDF file must match the date of submission of the printed versions).</p>
</li>
<li><p>The topic can only be returned once and only within the first month of the processing period.</p>
</li>
<li><p>A defense of the Master&#39;s thesis is not required.</p>
</li>
<li><p>The Master&#39;s thesis can be repeated once if it is assessed as “failed” (a second repetition of the Master&#39;s thesis is excluded)</p>
</li>
</ul>
<blockquote>
<p>Important Note:  you must submit your new Master&#39;s thesis no later than 3 months after receiving the letter from the Examination Office informing you of your failure.</p>
</blockquote>
</div>
  </details>
